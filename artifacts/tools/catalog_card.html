<!-- Catalog card: the Lab-page card (a.card.zin) as assets/lab.js renders it.
     Tokens filled by add_catalog.py: {{url}} {{target}} {{thumb}} {{subject}} {{description}} {{tags}} {{action}}.
     Comments are stripped on render. Keep attribute order: class, href, rel, target. -->
<a class="card zin" href="{{url}}" rel="noopener"{{target}}>{{thumb}}<h3>{{subject}}</h3><p>{{description}}</p>{{tags}}<span class="go">{{action}}</span></a>
