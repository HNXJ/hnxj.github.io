<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="../../ico1.jpg">
    <title> GLLLM Gallery | Research Assets | Hamed Nejat </title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito+Sans:200,300,400,700,900|Roboto+Mono:300,400,500">
    <link rel="stylesheet" href="../../assets/fonts/icomoon/style.css">
    <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/aos.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/madelane-theme.css">

    <style>
        .gallery-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(207, 184, 124, 0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
            height: 100%;
        }
        .gallery-item:hover {
            border-color: #CFB87C;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(207, 184, 124, 0.1);
        }
        .gallery-card-body {
            padding: 20px;
        }
        .gallery-category {
            color: #CFB87C;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .gallery-title {
            color: #fff;
            font-size: 1.1rem;
            font-family: 'Roboto Mono', monospace;
        }
        #gallery-grid {
            margin-top: 50px;
        }
        .hero-banner {
            background-image: url('../../assets/images/purple.jpg');
            height: 300px;
            min-height: 300px;
        }
        .gallery-title {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>

<body>
    <div class="site-wrap">
        <div class="site-navbar mt-4">
            <div class="container py-1">
                <div class="row align-items-center">
                    <div class="col-8 col-md-8 col-lg-4">
                        <h1 class="mb-0">
                            <a href="../../index.html" class="text-white h2 mb-0"><strong>GLLLM Gallery<span class="text-primary">.</span></strong></a>
                        </h1>
                    </div>
                    <div class="col-4 col-md-4 col-lg-8">
                        <nav class="site-navigation text-right text-md-right" role="navigation">
                            <ul class="site-menu js-clone-nav d-none d-lg-block">
                                <li><a href="../../index.html"> Home </a></li>
                                <li><a href="../about/"> About </a></li>
                                <li class="active"><a href="index.html"> Media </a></li>
                                <li><a href="../contact/"> Connect </a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>

        <div class="site-blocks-cover overlay hero-banner" data-aos="fade">
            <div class="container">
                <div class="row align-items-center justify-content-center">
                    <div class="col-md-7 text-center">
                        <h2 class="text-white gallery-title"> Research Asset Gallery </h2>
                        <p class="text-white-50"> High-fidelity visualizations from the GLLLM project. </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="site-section bg-dark">
            <div class="container">
                <div id="gallery-grid" class="row">
                    <div class="col-12 text-center">
                        <p class="text-muted">Loading gallery...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/jquery-3.3.1.min.js"></script>
    <script src="../../assets/js/bootstrap.min.js"></script>
    <script src="../../assets/js/aos.js"></script>

    <script>
        // Load gallery manifest and render items
        fetch('manifest.json')
            .then(response => response.json())
            .then(data => {
                const gallery = document.getElementById('gallery-grid');
                gallery.innerHTML = '';

                if (!data.gallery || data.gallery.length === 0) {
                    gallery.innerHTML = '<div class="col-12 text-center"><p class="text-muted">No gallery items yet.</p></div>';
                    return;
                }

                // Group items by category
                const byCategory = {};
                data.gallery.forEach(item => {
                    const cat = item.category || 'Other';
                    if (!byCategory[cat]) byCategory[cat] = [];
                    byCategory[cat].push(item);
                });

                // Render each category
                Object.keys(byCategory).sort().forEach(category => {
                    // Category header
                    const header = document.createElement('div');
                    header.className = 'col-12';
                    header.innerHTML = `<h3 class="text-white mt-5 mb-4" style="font-family: 'Roboto Mono', monospace; border-bottom: 1px solid rgba(207, 184, 124, 0.3); padding-bottom: 1rem;">${category}</h3>`;
                    gallery.appendChild(header);

                    // Items in category
                    byCategory[category].forEach(item => {
                        const col = document.createElement('div');
                        col.className = 'col-md-6 col-lg-4 mb-4';

                        col.innerHTML = `
                            <a href="${item.filename}" target="_blank" class="gallery-item d-block" style="text-decoration: none;">
                                <div class="gallery-card-body">
                                    <div class="gallery-category">${item.category}</div>
                                    <h5 class="gallery-title">${item.title}</h5>
                                    <p class="text-muted mb-2" style="font-size: 0.9rem;">${item.description}</p>
                                    <small class="text-muted d-block">${item.date}</small>
                                </div>
                            </a>
                        `;
                        gallery.appendChild(col);
                    });
                });

                // Initialize AOS for animations
                if (window.AOS) {
                    AOS.refresh();
                }
            })
            .catch(error => {
                console.error('Error loading gallery manifest:', error);
                const gallery = document.getElementById('gallery-grid');
                gallery.innerHTML = '<div class="col-12 text-center"><p class="text-danger">Error loading gallery.</p></div>';
            });
    </script>
</body>
</html>
